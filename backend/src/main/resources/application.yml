spring:
  application:
    name: orchestrator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orchestrator}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

dataset:
  analysis:
    service:
      url: ${DATASET_ANALYSIS_SERVICE_URL:http://localhost:8000}
